<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur de pixels</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1b1e24; color: #e8e8ea; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: #262a33; position: sticky; top: 0; z-index: 2; }
  button, select, label.btn { font: inherit; color: inherit; background: #363b47; border: 1px solid #4a5060; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button[aria-pressed=true] { background: #4c8a3a; border-color: #7fc04a; }
  input[type=color] { width: 36px; height: 32px; padding: 0; border: 0; background: none; }
  #pal { display: flex; flex-wrap: wrap; gap: 2px; max-width: 440px; }
  #pal i { width: 16px; height: 16px; border: 1px solid #0006; cursor: pointer; }
  main { padding: 16px; overflow: auto; }
  #stage { position: relative; display: inline-block; line-height: 0;
    background: repeating-conic-gradient(#3a3f4a 0 25%, #2c3039 0 50%) 0 0 / 16px 16px; }
  canvas { image-rendering: pixelated; touch-action: none; cursor: crosshair; }
  #grid { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(#0003 1px, transparent 1px), linear-gradient(90deg, #0003 1px, transparent 1px); }
  #prev { max-height: 128px; image-rendering: pixelated; background: #5b8fd6; border-radius: 6px; margin-left: auto; }
</style>
<header>
  <button data-tool="pen" aria-pressed="true">Crayon</button>
  <button data-tool="erase">Gomme</button>
  <button data-tool="fill">Pot</button>
  <button data-tool="pick">Pipette</button>
  <input type="color" id="color" value="#66bf2e" aria-label="Couleur">
  <div id="pal"></div>
  <label>Zoom <input type="range" id="zoom" min="2" max="16" value="3"></label>
  <label><input type="checkbox" id="showGrid" checked> Grille</label>
  <button id="undo">Annuler</button>
  <button id="gen">Nouveau cube</button>
  <select id="size" aria-label="Taille d'une toile vide">
    <option value="">Toile vide…</option><option>16</option><option>32</option><option>64</option><option>128</option><option>256</option>
  </select>
  <label class="btn">Importer <input type="file" id="imp" accept="image/*" hidden></label>
  <button id="exp">PNG</button>
  <button id="exp8">PNG ×8</button>
  <canvas id="prev" aria-label="Aperçu taille réelle"></canvas>
</header>
<main><div id="stage"><canvas id="c" width="128" height="128"></canvas><div id="grid"></div></div></main>
<script src="pixel-cube.js"></script>
<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d', { willReadFrequently: true }), prev = $('prev');
// ---------- L'éditeur ----------
let tool = 'pen', undoStack = [], last = null;
const snap = () => { undoStack.push(ctx.getImageData(0, 0, c.width, c.height)); if (undoStack.length > 50) undoStack.shift(); };
function layout() {
  const z = +$('zoom').value;
  c.style.width = c.width * z + 'px'; c.style.height = c.height * z + 'px';
  $('grid').style.backgroundSize = z + 'px ' + z + 'px';
  $('grid').hidden = !$('showGrid').checked || z < 4;
}
function saved() {
  prev.width = c.width; prev.height = c.height; prev.getContext('2d').drawImage(c, 0, 0);
  try { localStorage.setItem('pixel-editor-2', c.toDataURL()); } catch {}
}
function load(source, w, h) { snap(); c.width = w; c.height = h; source instanceof ImageData ? ctx.putImageData(source, 0, 0) : ctx.drawImage(source, 0, 0); layout(); saved(); }
const rgba = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).concat(255);
const toHex = d => '#' + [d[0], d[1], d[2]].map(n => n.toString(16).padStart(2, '0')).join('');

function fill(x, y) {
  const img = ctx.getImageData(0, 0, c.width, c.height), p = new Uint32Array(img.data.buffer), W = c.width;
  const from = p[y * W + x], to = new Uint32Array(new Uint8Array(rgba($('color').value)).buffer)[0];
  if (from === to) return;
  for (const st = [y * W + x]; st.length;) {
    const i = st.pop(); if (p[i] !== from) continue;
    p[i] = to; const cx = i % W;
    if (cx) st.push(i - 1); if (cx < W - 1) st.push(i + 1); if (i >= W) st.push(i - W); if (i < p.length - W) st.push(i + W);
  }
  ctx.putImageData(img, 0, 0);
}
function dot(x, y) {
  if (tool === 'erase') ctx.clearRect(x, y, 1, 1);
  else { ctx.fillStyle = $('color').value; ctx.fillRect(x, y, 1, 1); }
}
function line(a, b) {   // Bresenham
  let [x, y] = a; const [x1, y1] = b, dx = Math.abs(x1 - x), dy = -Math.abs(y1 - y), sx = x < x1 ? 1 : -1, sy = y < y1 ? 1 : -1; let e = dx + dy;
  for (;;) { dot(x, y); if (x === x1 && y === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x += sx; } if (e2 <= dx) { e += dx; y += sy; } }
}
const pos = e => { const r = c.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * c.width), Math.floor((e.clientY - r.top) / r.height * c.height)]; };
c.onpointerdown = e => {
  const p = pos(e);
  if (tool === 'pick') { const d = ctx.getImageData(p[0], p[1], 1, 1).data; if (d[3]) $('color').value = toHex(d); return setTool('pen'); }
  snap();
  if (tool === 'fill') { fill(...p); return saved(); }
  c.setPointerCapture(e.pointerId); last = p; dot(...p);
};
c.onpointermove = e => { if (!last) return; const p = pos(e); line(last, p); last = p; };
c.onpointerup = c.onpointercancel = () => { if (last) { last = null; saved(); } };

function setTool(t) { tool = t; document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)); }
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
for (const h of [...GRASS, ...DIRT, ...WATER, ...WALL, ...ROOF, OUTLINE, '#ffffff']) { const i = document.createElement('i'); i.style.background = h; i.onclick = () => { $('color').value = h; if (tool !== 'fill') setTool('pen'); }; $('pal').append(i); }
$('zoom').oninput = $('showGrid').onchange = layout;
$('undo').onclick = () => { const u = undoStack.pop(); if (u) { c.width = u.width; c.height = u.height; ctx.putImageData(u, 0, 0); layout(); saved(); } };
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); } });
$('gen').onclick = () => load(cube(Math.random() * 1e9 | 0), 256, 256);
$('size').onchange = e => { const n = +e.target.value; e.target.value = ''; if (n) load(new ImageData(n, n), n, n); };
$('imp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image(); im.onload = () => { const k = Math.min(1, 256 / Math.max(im.width, im.height)); snap(); c.width = im.width * k | 0; c.height = im.height * k | 0; ctx.drawImage(im, 0, 0, c.width, c.height); undoStack.pop(); layout(); saved(); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f); e.target.value = '';
};
function exportPng(k) {
  const o = document.createElement('canvas'); o.width = c.width * k; o.height = c.height * k;
  const x = o.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, o.width, o.height);
  const a = document.createElement('a'); a.download = 'pixels' + (k > 1 ? '-x' + k : '') + '.png'; a.href = o.toDataURL(); a.click();
}
$('exp').onclick = () => exportPng(1); $('exp8').onclick = () => exportPng(8);

// démarrage : reprend le dessin enregistré, sinon le cube
let stored = null; try { stored = localStorage.getItem('pixel-editor-2'); } catch {}
if (stored) { const im = new Image(); im.onload = () => { load(im, im.width, im.height); undoStack = []; }; im.src = stored; }
else { load(cube(7), 256, 256); undoStack = []; }
</script>
</html>
