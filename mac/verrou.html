<!doctype html>
<html lang="fr" data-skin="drawn" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../style.css">
<script src="../data/pedi.js"></script>
<script src="../data/podo.js"></script>
<script src="../data/anat.js"></script>
<script src="../data/quiz.js"></script>
<script src="../data/loges.js"></script>
<style>
  body { padding: 0; user-select: none; -webkit-user-select: none; cursor: default; }
  .wrap { max-width: 820px; padding-top: 40px; }
  .lock { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .lock .question { font-size: 32px; line-height: 1.2; margin: 6px 0 4px; }
  .lock .opt { font-size: 24px; padding: 14px 18px; display: flex; gap: 12px; }
  .lock .opt kbd { font: 400 18px var(--marker); opacity: .5; }
  .prog { height: 12px; border: 2.5px solid var(--ink); border-radius: 8px; background: var(--card); overflow: hidden; margin-bottom: 26px; }
  .prog i { display: block; height: 100%; background: var(--p6); transition: width .3s; }
  .top2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .urg { position: fixed; right: 18px; bottom: 14px; background: none; border: 0; font-size: 17px; color: var(--muted); opacity: .6; text-decoration: underline; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  .seg .btn { --c: var(--card); font-size: 17px; padding: 6px 14px; }
  .seg .btn.on { --c: var(--hl); }
  h2 { margin: 18px 0 8px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 8px; }
  .gsel .gh .box { border-color: var(--c); }
  .gsel .gh.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--card)); }
  .gsel .gh.on .box { background: var(--c); }
  .gsel .gh.part .box::after { content: '–'; }
  .sum { padding: 14px 0 30px; }
  .done { text-align: center; }
  .card.say { margin-top: 14px; background: #f3ecfb; border-color: var(--p3); }
  .card.say p { margin: 4px 0 0; font-size: 22px; line-height: 1.3; }
  .typed { display: grid; gap: 10px; margin-top: 14px; }
  .typed input { font: 600 24px var(--hand); padding: 12px 16px; border: 2.5px solid var(--ink); border-radius: 12px 10px 13px 11px; background: #fff; color: var(--ink); }
  .typed .btn { justify-self: start; }
  .ac { display: grid; gap: 6px; }
  .ac input { width: 100%; }
  #sug { max-height: 34vh; overflow-y: auto; display: grid; gap: 4px; padding: 4px; border: 2px dashed rgba(37,35,45,.3); border-radius: 12px; background: var(--card); }
  #sug:empty { display: none; }
  #sug button { text-align: left; font-size: 20px; line-height: 1.2; padding: 6px 12px; border: 0; border-radius: 8px; background: none; }
  #sug button.on, #sug button:hover { background: var(--hl); }
  .typed textarea { font: 600 22px/1.3 var(--hand); padding: 12px 16px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); resize: vertical; }
  .checks.one { grid-template-columns: 1fr; }
  .card .checks .ck { font-size: 20px; }
  .card .btn { margin-top: 10px; }
  .mem { margin: 10px 0 18px; }
  .mem .bar { display: flex; height: 16px; border: 2.5px solid var(--ink); border-radius: 9px; background: var(--card); overflow: hidden; }
  .mem i.su { background: var(--p6); } .mem i.cours { background: var(--hl); }
  .mem .leg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 19px; margin-top: 6px; }
  .mem .leg i { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 4px; margin-right: 5px; vertical-align: -1px; background: var(--card); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Verrou Révision. Deux écrans : #choix (ce qu'on révise) et #lock (la série qui bloque l'écran).
// Le choix suit la logique du site : off = ce qui est décoché (rien = tout).
// Mémorisation (boîtes de Leitner) : MEM[clé] = [boîte, date à revoir]. Juste → boîte suivante, revue plus tard ;
// raté → boîte 0. Une série prend d'abord ce qui est à revoir, puis du jamais vu : on avance sans rabâcher ce qui est su.
const $ = s => document.querySelector(s), app = $('#app');
const send = m => window.webkit && webkit.messageHandlers.verrou.postMessage(m);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const plain = s => String(s || '').replace(/\*\*/g, '').trim();
const norm = s => plain(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const uniq = a => [...new Set(a.map(plain).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'fr'));

const CFG = Object.assign({ off: {}, count: 10, interval: 60 }, window.CFG || {});
const MEM = window.MEM || {};
const DAY = 864e5, BOX = [0, 1, 3, 7, 15, 30, 60];   // jours avant de revoir, selon la boîte
const SU = 3;                                        // boîte 3 = tenu 3 jours puis 7 : « su »
const on = k => !CFG.off[k];
const QZ = window.QUIZ || {}, AQ = window.ANAT_Q || [], MUS = AQ.filter(x => x.nerf);
const REG = { pied: 'Pied', jambe: 'Jambe', cuisse: 'Cuisse' };
const RCOL = { pied: 'var(--p5)', jambe: 'var(--p4)', cuisse: 'var(--p1)' };
const akey = x => `a:${x.reg}:${x.kind === 'os' ? 'os' : 'mus'}`;
const PEDI = (window.PEDI || []).filter(f => QZ[f.id]), PODO = (window.PODO || []).filter(f => QZ[f.id]);
const TYPES = [['t:recite', 'Récite une partie (à voix haute)'], ['t:liste', 'Listes à trouver'], ['t:qcm', 'QCM']];
const GROUPS = [
  { k: 'pedi', n: 'Pédicurie', c: 'var(--p6)', it: PEDI.map(f => ['f:' + f.id, `${f.n}. ${f.title}`]) },
  { k: 'podo', n: 'Podologie', c: 'var(--p8)', it: PODO.map(f => ['f:' + f.id, `${f.n}. ${f.title}`]) },
  { k: 'anat', n: 'Anatomie', c: 'var(--p1)', it: ['pied', 'jambe', 'cuisse'].flatMap(r => [[`a:${r}:os`, `${REG[r]} · les os`], [`a:${r}:mus`, `${REG[r]} · les muscles`]]) },
  { k: 'types', n: 'Questions sur les fiches', c: 'var(--p3)', it: TYPES },
];

// --- anatomie : on écrit la réponse ; l'autocomplétion propose TOUTES les réponses possibles de ce type (pas d'indice)
const LG = window.LOGES || {}, LGOF = window.LOGE_OF || {};
const logeOf = x => LGOF[x.q] && LG[LGOF[x.q][0]] ? LG[LGOF[x.q][0]].n : '';
const ALLF = [...PEDI, ...PODO];
const LISTS = { name: uniq(AQ.map(x => x.name)), o: uniq(MUS.map(x => x.o)), t: uniq(MUS.map(x => x.t)), nerf: uniq(MUS.map(x => x.nerf)),
  loge: uniq(MUS.map(logeOf)), act: uniq(MUS.map(x => x.act)) };
const anatAsks = x => Object.entries({
  how: [`On palpe quoi ? ${x.how}`, 'name', x.name],
  ins: x.ins && !norm(x.ins).includes(norm(x.name).split(' ').pop()) && [`Quel os ? Ce qui s'y insère : ${x.ins}`, 'name', x.name],
  ot: x.o && [`Quel muscle ? Origine : ${x.o} · Terminaison : ${x.t}`, 'name', x.name],
  o: x.o && [`Origine de : **${x.name}** ?`, 'o', x.o],
  t: x.t && [`Terminaison de : **${x.name}** ?`, 't', x.t],
  nerf: x.nerf && [`Quel nerf innerve : **${x.name}** ?`, 'nerf', x.nerf],
  loge: logeOf(x) && [`Dans quelle loge est : **${x.name}** ?`, 'loge', logeOf(x)],
  act: x.act && [`Action de : **${x.name}** ?`, 'act', x.act],
}).filter(e => e[1]);

// --- toutes les questions possibles, chacune avec sa clé de mémorisation ---
function pool() {
  const P = [], fs = ALLF.filter(f => on('f:' + f.id));
  for (const f of fs) {
    const lab = f.title, c = PODO.includes(f) ? 'var(--p8)' : 'var(--p6)';
    QZ[f.id].forEach((z, p) => {
      const part = f.parts[p] ? f.parts[p].title : `Partie ${p + 1}`, say = f.parts[p] && f.parts[p].say && { part: `${p + 1}. ${part}`, text: f.parts[p].say };
      if (on('t:recite') && (z.k || []).length) P.push({ key: `r:${f.id}:${p}`, lab, c, long: 1, say, mk: () => ({ kind: 'recite', q: `${f.title} · récite à voix haute la partie **${p + 1}. ${part}**`, items: z.k }) });
      (z.q || []).forEach((s, i) => {
        const [q, a] = s.split(' | '); if (!a) return;
        if (a.includes(' || ')) { if (on('t:qcm')) { const [ok, bad] = a.split(' || '); P.push({ key: `q:${f.id}:${p}:${i}`, lab, c, say, mk: () => ({ kind: 'qcm', q, ok, opts: shuffle([ok, ...bad.split(' ; ')]) }) }); } }
        else if (a.includes(' ; ') && on('t:liste')) P.push({ key: `l:${f.id}:${p}:${i}`, lab, c, say, mk: () => ({ kind: 'liste', q, items: a.split(' ; ') }) });
      });
    });
  }
  AQ.filter(x => on(akey(x))).forEach(x => anatAsks(x).forEach(([k, [q, list, ok]]) =>
    P.push({ key: `a:${x.q}:${k}`, lab: `Anatomie · ${REG[x.reg]}`, c: RCOL[x.reg], mk: () => ({ kind: 'typed', q, ok: plain(ok), list }) })));
  return P;
}
const state = it => { const m = MEM[it.key]; return !m ? 'new' : m[0] >= SU ? 'su' : 'cours'; };
function pickSeries(P, n) {   // d'abord ce qui est à revoir (les moins sus d'abord), puis du jamais vu, puis le plus proche
  const now = Date.now(), due = [], fresh = [], later = [];
  for (const it of P) { const m = MEM[it.key]; (!m ? fresh : m[1] <= now ? due : later).push(it); }
  due.sort((a, b) => MEM[a.key][0] - MEM[b.key][0] || MEM[a.key][1] - MEM[b.key][1]);
  later.sort((a, b) => MEM[a.key][1] - MEM[b.key][1]);
  const out = []; let long = 0;
  for (const it of [...due, ...shuffle(fresh), ...later]) {
    if (out.length >= n) break;
    if (it.long && long >= 2) continue;   // au plus 2 « récite » par série
    long += it.long ? 1 : 0; out.push(it);
  }
  return shuffle(out);
}
function remember(key, good) {
  const b = good ? Math.min(((MEM[key] || [0])[0]) + (MEM[key] ? 1 : 2), BOX.length - 1) : 0;   // jamais vu et juste : on saute à la boîte 2
  MEM[key] = [b, Date.now() + BOX[b] * DAY - (b ? 2 * 36e5 : 0), ((MEM[key] || [])[2] || 0) + (good ? 0 : 1)];   // revu un peu avant l'heure pile ; [2] = erreurs en tout
  send({ mem: MEM });
}

// --- écran de choix ---
function choix() {
  const seg = (k, vals, unit) => `<div class="seg">${vals.map(v => `<button class="btn ${CFG[k] === v ? 'on' : ''}" data-set="${k}" data-v="${v}">${v} ${unit}</button>`).join('')}</div>`;
  app.innerHTML = `<div class="wrap"><h1>Tu révises quoi ?</h1><div id="stats"></div>
    ${GROUPS.map(g => `<div class="gsel" style="--c:${g.c}"><button class="ck gh" data-grp="${g.k}"><span class="box"></span><b>${g.n}</b><span class="muted gn"></span></button>
      <details ${g.k === 'types' ? 'open' : ''}><summary>Choisir dans la liste</summary><div class="checks">${g.it.map(([k, t]) => `<button class="ck" data-tog="${k}"><span class="box"></span><span>${esc(t)}</span></button>`).join('')}</div></details></div>`).join('')}
    <h2>Questions par série</h2>${seg('count', [5, 10, 15, 20], 'questions')}
    <h2>Une série toutes les</h2>${seg('interval', [30, 45, 60, 90, 120], 'min')}
    <div class="checks one"><button class="ck" data-tog="son:debut"><span class="box"></span><span>Un son calme quand la série commence</span></button></div>
    <div class="sum"><button class="btn wide" id="ok">C'est bon</button></div></div>`;
  sync();
}
function sync() {
  document.querySelectorAll('.gsel').forEach(el => {
    const bs = [...el.querySelectorAll('[data-tog]')], n = bs.filter(b => on(b.dataset.tog)).length;
    bs.forEach(b => b.classList.toggle('on', on(b.dataset.tog)));
    const h = el.querySelector('.gh'); h.classList.toggle('on', n > 0); h.classList.toggle('part', n > 0 && n < bs.length);
    el.querySelector('.gn').textContent = `${n}/${bs.length}`;
  });
  document.querySelectorAll('.wrap > .checks [data-tog]').forEach(b => b.classList.toggle('on', on(b.dataset.tog)));
  document.querySelectorAll('[data-set]').forEach(b => b.classList.toggle('on', CFG[b.dataset.set] === +b.dataset.v));
  const P = pool(), n = P.length, ok = $('#ok'), c = { su: 0, cours: 0, new: 0 };
  P.forEach(it => c[state(it)]++);
  const now = Date.now(), due = P.filter(it => MEM[it.key] && MEM[it.key][1] <= now).length, pc = k => n ? 100 * c[k] / n : 0;
  $('#stats').innerHTML = n ? `<div class="mem"><div class="bar"><i class="su" style="width:${pc('su')}%"></i><i class="cours" style="width:${pc('cours')}%"></i></div>
    <div class="leg"><span><i class="su"></i>${c.su} sues</span><span><i class="cours"></i>${c.cours} en cours</span><span><i></i>${c.new} jamais vues</span><span>· ${due} à revoir maintenant</span></div></div>` : '';
  ok.disabled = !n; ok.textContent = n ? `C'est bon · ${n} questions possibles` : 'Coche au moins une chose';
  send({ save: CFG });
}
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tog) { if (CFG.off[d.tog]) delete CFG.off[d.tog]; else CFG.off[d.tog] = 1; sync(); }
  else if (d.grp) { const it = GROUPS.find(g => g.k === d.grp).it, all = it.every(x => on(x[0])); it.forEach(x => { if (all) CFG.off[x[0]] = 1; else delete CFG.off[x[0]]; }); sync(); }
  else if (d.set) { CFG[d.set] = +d.v; sync(); }
  else if (t.id === 'ok') send({ close: 1 });
  else if (d.j != null) finish(L.cur.opts[+d.j] === L.cur.ok, +d.j);
  else if (t.id === 'next') draw();
  else if (t.id === 'val') answerTyped();
  else if (d.sug) { $('#ans').value = d.sug; answerTyped(); }
  else if (t.id === 'said') { L.cur.phase = 1; render(); }
  else if (d.mark != null) { L.cur.marks[+d.mark] = !L.cur.marks[+d.mark]; render(); }
  else if (t.id === 'check') checkMarks();
  else if (t.id === 'urg') urgence(t);
});

// --- la série : on ne sort qu'en ayant tout juste ; une ratée revient à la fin ---
let L;
function lock() {
  const p = pool(); if (!p.length) return send({ done: 1 });
  L = { queue: pickSeries(p, CFG.count), ok: 0, seen: {} }; L.total = L.queue.length;
  draw();
}
function draw() {
  if (!L.queue.length) {
    app.innerHTML = `<div class="wrap lock done"><h1>Série finie !</h1><p class="question">${L.total} sur ${L.total}. Bon retour sur ton Mac.</p></div>`;
    return setTimeout(() => send({ done: 1 }), 1400);
  }
  const c = L.queue[0]; L.cur = Object.assign({ c, phase: 0, marks: [], typed: [] }, c.mk()); L.done = null; sugI = 0;
  render();
}
const optsHTML = s => `<div class="opts">${s.opts.map((o, j) => `<button class="opt ${L.done ? (o === s.ok ? 'good' : j === L.pick ? 'bad' : 'dim') : ''}" data-j="${j}" ${L.done ? 'disabled' : ''}>${L.done ? '' : `<kbd>${j + 1}</kbd>`}<span>${md(o)}</span></button>`).join('')}</div>`;
const inputHTML = () => `<div class="ac"><input id="ans" placeholder="Écris ta réponse…" autocomplete="off" spellcheck="false"><div id="sug"></div></div><button class="btn" id="val">Valider (Entrée)</button>`;
const marksHTML = (items, hint) => `<p class="muted">${hint}</p><div class="checks one">${items.map((k, j) => `<button class="ck ${L.cur.marks[j] ? 'on' : ''}" data-mark="${j}" ${L.done ? 'disabled' : ''}><span class="box"></span><span>${md(k)}</span></button>`).join('')}</div>
  ${L.done ? '' : '<button class="btn" id="check">Valider (Entrée)</button>'}`;
function body(s) {
  if (s.kind === 'qcm') return optsHTML(s);
  if (s.kind === 'typed') return L.done ? `<div class="opt ${L.good ? 'good' : 'bad'}">${esc(s.typed[0])}</div>${L.good ? '' : `<div class="opt good">${md(s.ok)}</div>`}` : `<div class="typed">${inputHTML()}</div>`;
  if (s.kind === 'recite') return s.phase === 0 ? `<p class="muted">Dis tout ce que tu sais sur cette partie, sans regarder. Ensuite tu coches ce que tu as dit.</p><button class="btn" id="said">J'ai récité (Entrée)</button>`
    : marksHTML(s.items, 'Coche ce que tu as dit (il en faut 80 %) :');
  if (s.kind === 'liste') return s.phase === 0 ? `<div class="typed"><textarea id="ta" rows="4" placeholder="Une idée par ligne…"></textarea><button class="btn" id="check">Valider (Cmd+Entrée)</button></div>`
    : `<div class="opt">${esc(s.text).replace(/\n/g, '<br>')}</div>` + marksHTML(s.items, 'Ce que tu as trouvé est coché ; corrige si besoin (il en faut 60 %) :');
}
function render() {
  const s = L.cur;
  app.innerHTML = `<div class="wrap lock">
    <div class="top2"><span class="qpart" style="--c:${s.c.c}">${esc(s.c.lab)}</span><span class="marker">${L.ok} / ${L.total}</span></div>
    <div class="prog"><i style="width:${100 * L.ok / L.total}%"></i></div>
    <div class="card"><div class="question">${md(s.q)}</div>${body(s)}</div>
    ${L.done && !L.good && L.say ? `<div class="card say"><div class="qpart" style="--c:var(--p3)">Ce que je dis à l'oral · ${esc(L.say.part)}</div><p>${md(L.say.text)}</p></div>` : ''}
    ${L.done && !L.good ? `<div class="btns"><button class="btn wide" id="next">Compris, elle reviendra (Entrée)</button></div>` : ''}
    <button class="urg" id="urg">${L.urgTxt || 'Urgence'}</button></div>`;
  const i = $('#ans') || $('#ta'); if (i) { i.focus(); if (i.id === 'ans') suggest(); }
}
function finish(good, j) {
  if (L.done) return;
  const c = L.queue.shift(); L.done = 1; L.good = good; L.pick = j;
  if (!L.seen[c.key]) { L.seen[c.key] = 1; remember(c.key, good); }   // la mémoire ne compte que le premier essai
  if (!good) {   // trop d'erreurs (2 dans la série ou 3 en tout) : on montre ce qu'on dit à l'oral pour cette partie
    L.fails = L.fails || {}; L.fails[c.key] = (L.fails[c.key] || 0) + 1;
    L.say = c.say && (L.fails[c.key] >= 2 || (MEM[c.key] || [])[2] >= 3) ? c.say : null;
  }
  if (good) { L.ok++; render(); setTimeout(draw, 800); } else { L.queue.push(c); render(); }
}
// listes : on reconnaît une idée si un de ses mots importants (5 lettres et plus) est dans ce qu'on a écrit
const found = (item, text) => { const t = ' ' + norm(text) + ' ', w = norm(item).split(' ').filter(x => x.length >= 5); return w.length ? w.some(x => t.includes(' ' + x.slice(0, 5))) : t.includes(' ' + norm(item) + ' '); };
function checkMarks() {
  const s = L.cur;
  if (s.kind === 'liste' && s.phase === 0) { s.text = $('#ta').value; s.marks = s.items.map(k => found(k, s.text)); s.phase = 1; return render(); }
  const n = s.marks.filter(Boolean).length;
  finish(n >= Math.ceil(s.items.length * (s.kind === 'recite' ? 0.8 : 0.6)));
}
function answerTyped() {
  const i = $('#ans'); if (!i || !i.value.trim()) return;
  const s = L.cur, v = i.value.trim(), same = (a, b) => norm(a) === norm(b) || norm(a) === norm(b.replace(/\(.*?\)/g, ''));
  s.typed = [v]; finish(same(v, s.ok));
}
// autocomplétion maison : toute la liste du type de réponse, filtrée par les mots tapés
let sugI = 0;
function suggest() {
  const i = $('#ans'), box = $('#sug'); if (!i) return;
  const t = norm(i.value), w = t.split(' ').filter(Boolean);
  const hits = LISTS[L.cur.list].filter(v => w.every(x => norm(v).includes(x))).sort((x, y) => (norm(y) === t) - (norm(x) === t));
  sugI = Math.min(sugI, Math.max(0, hits.length - 1));
  box.innerHTML = hits.map((v, k) => `<button class="${k === sugI ? 'on' : ''}" data-sug="${esc(v)}">${esc(v)}</button>`).join('');
  const b = box.children[sugI]; if (b) b.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('input', e => { if (e.target.id === 'ans') { sugI = 0; suggest(); } });
document.addEventListener('keydown', e => {
  if (!L || !L.cur) return;
  const s = L.cur;
  if (e.target.id === 'ans') {
    const n = $('#sug').children.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sugI = (sugI + (e.key === 'ArrowDown' ? 1 : n - 1)) % Math.max(n, 1); suggest(); }
    else if (e.key === 'Enter') { e.preventDefault(); const b = $('#sug').children[sugI]; if (b && e.target.value.trim()) e.target.value = b.dataset.sug; answerTyped(); }
    return;
  }
  if (e.target.id === 'ta') { if (e.key === 'Enter' && e.metaKey) { e.preventDefault(); checkMarks(); } return; }
  if (e.key === 'Enter') { e.preventDefault(); if ($('#next')) draw(); else if ($('#said')) $('#said').click(); else if ($('#check')) checkMarks(); return; }
  if (s.kind === 'qcm' && /^[1-9]$/.test(e.key) && +e.key <= s.opts.length) finish(s.opts[+e.key - 1] === s.ok, +e.key - 1);
});
function urgence() {   // soupape : 2 minutes d'attente, et la série revient 10 minutes plus tard
  if (L.urg) return; L.urg = 1;
  let s = 120;
  const t = setInterval(() => { s--; L.urgTxt = `Déblocage dans ${s} s`; const u = $('#urg'); if (u) u.textContent = L.urgTxt; if (s <= 0) { clearInterval(t); send({ urgence: 1 }); } }, 1000);
}

location.hash === '#lock' ? lock() : choix();
</script>
